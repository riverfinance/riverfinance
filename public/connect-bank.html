<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connect Your Bank Account</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<style>
  html, body { margin:0; padding:0; height:100%; }
  #frame { width:100%; height:100vh; border:0; display:none; }
  #loading {
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
  }
  .spinner {
    width:28px; height:28px;
    border-radius:50%;
    border:3px solid #ddd;
    border-top-color:#888;
    animation:spin 0.8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  #logo {
    display:block;
    margin:40px auto 0;
    height:34px;
  }
</style>
</head>
<body>

<img id="logo" src="assets/river-mark.png" alt="River Finance">
<div id="loading"><div class="spinner"></div></div>
<iframe id="frame"></iframe>

<script>
  (async function () {
    try {
      const response = await fetch('/api/flinks-token', { method: 'POST' });
      const result = await response.json();
      if (!response.ok || !result.ok || !result.iframeUrl) {
        throw new Error();
      }
      const frame = document.getElementById('frame');
      frame.src = result.iframeUrl;
      frame.onload = () => {
        document.getElementById('loading').style.display = 'none';
        frame.style.display = 'block';
      };
    } catch (err) {
      document.getElementById('loading').innerHTML = 'Something went wrong. Please refresh the page.';
    }
  })();
</script>

</body>
</html>
